{% set name = "sparse" %}
{% set version = "0.19.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: a95a52c63b45e2071df014d3f60080d36d160288131533a3b844021450677430

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<311]

requirements:
  host:
    - python
    - pip
    - setuptools >=64
    - setuptools-scm >=8
  run:
    - python
    - numpy >=1.17
    - numba >=0.49
  run_constrained:
    - finch-tensor >=0.2.13
    - finch-mlir >=0.0.2

# E   ModuleNotFoundError: No module named 'mlir_finch'
{% set ignore_tests = " --ignore=mlir_backend/tests" %}

test:
  imports:
    - sparse
  requires:
    - pip
    - pytest
    - dask
    - scipy
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -vv {{ ignore_tests }} --pyargs sparse.tests

about:
  home: https://sparse.pydata.org
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Sparse multi-dimensional arrays for the PyData ecosystem
  description: |
    sparse implements sparse multidimensional arrays on top of Numpy
    and scipy.sparse. It tries to mimic Numpy's ndarray API.
  doc_url: https://sparse.pydata.org
  dev_url: https://github.com/pydata/sparse

extra:
  recipe-maintainers:
    - hameerabbasi
    - mrocklin
    - jakevdp
